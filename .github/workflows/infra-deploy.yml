name: Access infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/infra-deploy.yml
      - .sops.yaml
      - infra/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/infra-deploy.yml
      - .sops.yaml
      - infra/**
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  SOPS_VERSION: 3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install SOPS
        run: |
          set -euo pipefail
          sops_binary="${RUNNER_TEMP}/sops"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output "$sops_binary"
          printf '%s  %s\n' "$SOPS_SHA256" "$sops_binary" | sha256sum --check --status
          sudo install -m 0755 "$sops_binary" /usr/local/bin/sops

      - name: Check and validate Terraform
        run: |
          set -euo pipefail
          bash -n infra/tf.sh
          sops filestatus infra/backend.wasabi.sops.env | jq -e '.encrypted == true' >/dev/null
          terraform -chdir=infra fmt -check -diff
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate -no-color

  deploy:
    name: Deploy Terraform
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: main
    concurrency:
      group: events-api-2026-access-infrastructure
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install SOPS
        run: |
          set -euo pipefail
          sops_binary="${RUNNER_TEMP}/sops"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output "$sops_binary"
          printf '%s  %s\n' "$SOPS_SHA256" "$sops_binary" | sha256sum --check --status
          sudo install -m 0755 "$sops_binary" /usr/local/bin/sops
          sops --version

      - name: Plan and apply Terraform
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_enabled_environments: ${{ vars.ENABLED_ENVIRONMENTS || '["staging","prod"]' }}
          TF_VAR_allowed_identity_provider_ids: ${{ vars.ALLOWED_IDENTITY_PROVIDER_IDS }}
          TF_VAR_session_duration: ${{ vars.SESSION_DURATION || '24h' }}
        run: |
          set -euo pipefail

          fail() {
            printf 'error: %s\n' "$*" >&2
            exit 1
          }

          require_value() {
            local name="$1"
            [[ -n "${!name:-}" ]] || fail "GitHub Environment value is missing: ${name}"
          }

          validate_string_array() {
            local name="$1"
            jq -e 'type == "array" and all(.[]; type == "string")' \
              >/dev/null <<<"${!name}" ||
              fail "${name} must be a JSON array of strings"
          }

          require_value SOPS_AGE_KEY
          require_value CLOUDFLARE_API_TOKEN
          require_value TF_VAR_cloudflare_account_id
          require_value TF_VAR_allowed_identity_provider_ids

          [[ "$TF_VAR_cloudflare_account_id" =~ ^[0-9a-f]{32}$ ]] ||
            fail "CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal ID"

          validate_string_array TF_VAR_enabled_environments
          validate_string_array TF_VAR_allowed_identity_provider_ids

          jq -e 'length > 0 and all(.[]; . == "staging" or . == "prod")' \
            >/dev/null <<<"$TF_VAR_enabled_environments" ||
            fail "ENABLED_ENVIRONMENTS must contain staging, prod, or both"
          jq -e 'length > 0' >/dev/null <<<"$TF_VAR_allowed_identity_provider_ids" ||
            fail "ALLOWED_IDENTITY_PROVIDER_IDS must not be empty"

          plan_file="${RUNNER_TEMP}/access-infrastructure.tfplan"
          cleanup() {
            rm -f -- "$plan_file"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ./infra/tf.sh init -reconfigure -lockfile=readonly -lock-timeout=5m
          ./infra/tf.sh plan \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            -out="$plan_file"
          ./infra/tf.sh apply \
            -input=false \
            -lock-timeout=5m \
            -no-color \
            "$plan_file"
