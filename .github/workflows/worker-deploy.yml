name: Deploy Worker

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: events-api-2026-worker-${{ github.event_name == 'release' && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'release' && 'prod' || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      # Cloudflare token / account ID を Infrastructure workflow と共有する。
      name: main
      url: ${{ github.event_name == 'release' && 'https://events26.koudaisai.jp' || 'https://events26-staging.koudaisai.jp' }}
    env:
      CI: "true"
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'release' && 'prod' || 'staging' }}
      DEPLOY_URL: ${{ github.event_name == 'release' && 'https://events26.koudaisai.jp' || 'https://events26-staging.koudaisai.jp' }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          set -euo pipefail
          bun run lint
          bunx tsc --noEmit
          bun run test

      # mainへ初めてbucket定義とbindingを同時にmergeしたとき、並列起動した
      # Terraform applyよりWorker deployが先行しないよう作成完了を待つ。
      - name: Wait for icon bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            printf 'error: GitHub Environment secret is missing: CLOUDFLARE_API_TOKEN\n' >&2
            exit 1
          }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            printf 'error: CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal ID\n' >&2
            exit 1
          }

          icon_bucket="events-api-2026-icons-${DEPLOY_ENVIRONMENT}"
          for attempt in {1..120}; do
            if bunx wrangler r2 bucket info "$icon_bucket" >/dev/null 2>&1; then
              printf 'R2 bucket is ready: %s\n' "$icon_bucket"
              exit 0
            fi

            if [[ "$attempt" -eq 120 ]]; then
              printf 'error: R2 bucket was not created: %s\n' "$icon_bucket" >&2
              exit 1
            fi

            sleep 5
          done

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            printf 'error: GitHub Environment secret is missing: CLOUDFLARE_API_TOKEN\n' >&2
            exit 1
          }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            printf 'error: CLOUDFLARE_ACCOUNT_ID must be a 32-character lowercase hexadecimal ID\n' >&2
            exit 1
          }

          bunx wrangler d1 migrations apply DB \
            --env "$DEPLOY_ENVIRONMENT" \
            --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler deploy --env "$DEPLOY_ENVIRONMENT" --minify

      - name: Verify custom domain
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "${DEPLOY_URL}/openapi.json" \
            >/dev/null
